name: Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native foundation (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            bundle: apps/native/build/linux/x64/release/bundle
          - os: windows-2022
            target: windows
            bundle: apps/native/build/windows/x64/runner/Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
      - name: Linux native build and test dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsqlite3-dev libglu1-mesa xvfb xauth dbus-x11 gnome-keyring fuse3
      - name: Bootstrap exact official Flutter revision
        working-directory: .
        run: python scripts/bootstrap_flutter.py
      - name: Add Flutter to PATH (Linux)
        if: matrix.target == 'linux'
        run: echo "$GITHUB_WORKSPACE/.tools-stage1/flutter/bin" >> "$GITHUB_PATH"
      - name: Add Flutter to PATH (Windows)
        if: matrix.target == 'windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.tools-stage1\flutter\bin"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Native Linux plugin and restart test
        if: matrix.target == 'linux'
        working-directory: .
        run: python scripts/test_linux_native.py
      - name: Native Windows plugin and restart test
        if: matrix.target == 'windows'
        run: flutter test integration_test/foundation_test.dart -d windows
      - run: flutter build ${{ matrix.target }} --release
      - name: Check release assets and literal keys
        working-directory: .
        run: python scripts/check_native_bundle.py ${{ matrix.bundle }}
      - name: Build private desktop evaluation package
        working-directory: .
        run: python scripts/desktop_package.py build --target ${{ matrix.target }}-x64 --bundle ${{ matrix.bundle }} --output dist/stage8
      - name: Assemble private evaluation handoff from this build
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          import sys
          import tarfile
          import tempfile
          import zipfile
          sys.path.insert(0, str(Path.cwd()))
          from scripts.build_handoff import build
          suffix = '*.tar.gz' if '${{ matrix.target }}' == 'linux' else '*.zip'
          archive, = Path('dist/stage8').glob(suffix)
          with tempfile.TemporaryDirectory(prefix='ytpd-ci-handoff-') as directory:
              # Only unpack the package just built in this clean CI checkout.
              if archive.name.endswith('.tar.gz'):
                  with tarfile.open(archive) as source:
                      source.extractall(directory, filter='data')
              else:
                  with zipfile.ZipFile(archive) as source:
                      source.extractall(directory)
              print(build(Path(directory) / 'ytpd', Path('dist/stage9/evaluation-handoff.zip')))

  stage0:
    name: Existing media contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
      - run: sudo apt-get update
      - name: Install and record the CI codec compatibility runtime
        run: |
          sudo apt-get install -y ffmpeg=7:6.1.1-3ubuntu5
          ffmpeg -version
          ffprobe -version
      - run: python3 -m venv .venv-ci
      - run: .venv-ci/bin/python -m pip install -r requirements-stage0.lock
      - run: .venv-ci/bin/python -m unittest discover -s tests -v

  android:
    name: Android foundation test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
      - name: Record Android build environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          cat "$ANDROID_HOME/platforms/android-36/source.properties"
      - name: Bootstrap exact official Flutter revision
        working-directory: .
        run: python scripts/bootstrap_flutter.py
      - run: echo "$GITHUB_WORKSPACE/.tools-stage1/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Build personal foundation test APK
        run: flutter build apk --debug --target-platform android-arm64 --no-pub
      - name: Verify debug signature and packaged assets
        working-directory: .
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs apps/native/build/app/outputs/flutter-apk/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apps/native/build/app/outputs/flutter-apk/app-debug.apk
          python scripts/check_android_apk.py apps/native/build/app/outputs/flutter-apk/app-debug.apk
