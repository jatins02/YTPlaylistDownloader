name: yt_playlist_downloader
description: Private on-device playlist drafts and native media foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  flutter_secure_storage: 11.2.0
  path: 1.9.1
  path_provider: 2.1.6
  sqflite: 2.4.4+1
  sqflite_common: 2.5.13+1
  sqflite_common_ffi: 2.4.3
  uuid: 4.6.0
  file_selector: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/process_guard.py
    - assets/metadata_tools.py
